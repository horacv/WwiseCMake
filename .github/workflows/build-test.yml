name: Build and Test (Windows, macOS)

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        os_config:
          - os: windows-latest
            platform: windows
            imgui_version: "1.92.8"
            wwise_version: "2026.1.1.9196"
            sdl_version: "3.4.12"
            ttf_version: "3.2.2"
          - os: macos-latest
            platform: mac
            imgui_version: "1.92.8"
            wwise_version: "2026.1.1.9196"
            sdl_version: "3.4.12"
            ttf_version: "3.2.2"

    runs-on: ${{ matrix.os_config.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Setup imGUI
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python tools/setup_imgui_sources.py ${{ matrix.os_config.imgui_version }} --delete-installer

      - name: Setup Wwise API
        env:
          WWISE_SDK_REPO_TOKEN : ${{ secrets.WWISE_SDK_REPO_TOKEN }}
          WWISE_SDK_REPO_CONTENTS_URL : ${{ secrets.WWISE_SDK_REPO_CONTENTS_URL }}
          PYTHONIOENCODING: utf-8
        run: |
          curl -H "Authorization: token ${{ env.WWISE_SDK_REPO_TOKEN }}" -H "Accept: application/vnd.github.v3.raw" -L -o get_wwise_sdk.py "${{ env.WWISE_SDK_REPO_CONTENTS_URL }}/get_wwise_sdk.py"
          
          python get_wwise_sdk.py "${{ matrix.os_config.wwise_version }}" "${{ env.WWISE_SDK_REPO_TOKEN }}"
          tar -xf "Wwise${{ matrix.os_config.wwise_version }}.tar"
          python tools/install_wwise_sdk.py "Wwise${{ matrix.os_config.wwise_version }}" "${{ matrix.os_config.platform }}"
          
      - name: Setup SDL and SDL_ttf
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python tools/setup_sdl_and_ttf.py --platform ${{ matrix.os_config.platform }} --delete-installer True --sdl-version ${{ matrix.os_config.sdl_version }} --ttf-version ${{ matrix.os_config.ttf_version }}

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -B build

      - name: Configure CMake (macOS)
        if: runner.os != 'Windows'
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake --build build --config ${{ matrix.build_type }}

      - name: Build (macOS)
        if: runner.os != 'Windows'
        run: |
          cmake --build build

      - name: Run application (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 1
        run: |
          cd build
          Start-Process -FilePath ".\WwiseCMake.exe" -PassThru | ForEach-Object {
            Start-Sleep -Seconds 10
            if (!$_.HasExited) { Stop-Process -Id $_.Id -Force }
          }

      - name: Run application (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 1
        run: |
          cd build
          ./WwiseCmake &
          PID=$!
          sleep 10
          kill $PID 2>/dev/null || true

      - name: Upload build artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.os_config.platform }}-${{ matrix.build_type }}
          path: |
            build/
            !build/**/*.o
            !build/**/*.obj
